name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - run: pytest -q
      # TEST HARNESS, not a real check. Uses GitHub's own PR commit count,
      # which is immune to the merge commit that `actions/checkout` produces on
      # pull_request events (that inflated a 1-commit branch to 2).
      - name: require-second-round
        if: github.event_name == 'pull_request'
        run: |
          n=${{ github.event.pull_request.commits }}
          echo "PR commit count: $n"
          if [ "$n" -lt 2 ]; then
            echo "::error::harness: PR has $n commit(s); the repair loop must push again"
            exit 1
          fi
